# Solo para una base desechable; no conecta ni modifica la base existente.
services:
  postgres-tests:
    image: postgres:16
    environment:
      POSTGRES_DB: invoicing_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docs/invoicing_db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoicing_test"]
      interval: 2s
      timeout: 3s
      retries: 20
